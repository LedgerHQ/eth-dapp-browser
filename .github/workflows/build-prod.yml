name: build-prod

# -> <APP repo>: .github/workflows/build-prod.yml
# Build + push the prod image on every push to main.
# Image: infra-oci-web-apps-prod-green/eth-dapp-browser/prod:<semver>
# If the Dockerfile needs build secrets, add them as explicit `secrets:`/`build-args:`
# on docker/build-push-action below — don't assume "no secrets needed".
on:
  push:
    branches: [main]

concurrency:
  group: build-prod-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # create the git tag
  id-token: write # GitHub OIDC -> JFrog

env:
  REGISTRY: jfrog.ledgerlabs.net
  IMAGE: infra-oci-web-apps-prod-green/eth-dapp-browser/prod

jobs:
  build:
    runs-on: public-ledgerhq-shared-medium
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tag history for version calculation

      - name: Compute next version
        id: ver
        # Pin to v6.2, NOT the bare "@v6" — that major-version alias tag was
        # never published for this action (only v6.0/v6.1/v6.2 exist), so
        # "@v6" fails at workflow-start with "unable to find version v6".
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          dry_run: true

      - name: JFrog OIDC login
        id: jfrog
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: https://${{ env.REGISTRY }}
        with:
          oidc-provider-name: github-oidc
          oidc-audience: jfrog-github # mandatory — else "Invalid audience"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ steps.jfrog.outputs.oidc-user }}
          password: ${{ steps.jfrog.outputs.oidc-token }}

      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_ANALYTICS_WRITE_KEY=${{ vars.NEXT_PUBLIC_ANALYTICS_WRITE_KEY }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.ver.outputs.new_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.ver.outputs.new_version }}-${{ github.sha }}

      - name: Create git tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          custom_tag: ${{ steps.ver.outputs.new_version }}
